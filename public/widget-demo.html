<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat widget demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Chat widget demo</h1>
    <p>
      Demo page. Add a widget id in the URL, for example
      <code>?siteId=your-site-id</code>.
    </p>
    <p id="demo-status"></p>
    <script>
      const params = new URLSearchParams(window.location.search);
      const siteId = params.get("siteId");
      const status = document.getElementById("demo-status");

      if (siteId) {
        window.ChatWidget = { siteId };
        status.textContent = `Loading widget ${siteId}.`;
      } else {
        status.textContent = "No widget id provided. The launcher will stay hidden.";
      }
    </script>
    <script async src="/widget.js"></script>
  </body>
</html>
